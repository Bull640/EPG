name: Update EPG

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build EPG
        run: python auto_update_epg.py

      - name: Commit and push if changed
        run: |
          git config user.name "epg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add epg_xtream.xml.gz
          git diff --cached --quiet || git commit -m "Auto-update EPG $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
